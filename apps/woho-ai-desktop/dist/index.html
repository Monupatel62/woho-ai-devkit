<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoHo AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:960px;min-height:100vh;background:#09090d;color:#f5f5f7;font:14px system-ui,sans-serif}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid #24242e;background:#0c0c12;display:flex;flex-direction:column;gap:18px}
.brand{font-size:22px;font-weight:800}.new{padding:10px;border:1px solid #363646;border-radius:10px;background:#181824;color:#fff;text-align:left}.nav{display:grid;gap:6px;color:#aaaab8}.nav span{padding:9px;border-radius:8px}.nav span:first-child{background:#191923;color:#fff}.foot{margin-top:auto;color:#696979;font-size:12px}
.main{display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #24242e}.top small{display:block;color:#777786;margin-top:3px}.status{padding:6px 10px;border:1px solid #30402f;border-radius:999px;color:#b8d8ad;font-size:12px}
.chat{padding:28px 15%;overflow:auto}.msg{max-width:780px;margin-bottom:22px}.msg.user{margin-left:auto;padding:14px 16px;border-radius:14px;background:#1b1b27}.role{color:#8f8fa0;font-size:12px;font-weight:700;text-transform:uppercase}.text{margin-top:8px;line-height:1.6;white-space:pre-wrap}
.compose{display:grid;grid-template-columns:1fr auto;gap:10px;padding:18px 15%;border-top:1px solid #24242e}.compose input{padding:14px;border:1px solid #343442;border-radius:12px;background:#111119;color:#fff}.compose button{padding:0 20px;border:0;border-radius:12px;background:#fff;color:#09090d;font-weight:700}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">WoHo AI</div><button class="new" id="new">+ New Chat</button><nav class="nav"><span>Chats</span><span>Projects</span><span>Files</span><span>Tools</span><span>Agents</span></nav><div class="foot">Desktop Foundation · 0.1.0</div></aside>
<section class="main"><header class="top"><div><strong>WoHo AI</strong><small>Local-first agent workspace</small></div><span class="status">Foundation Ready</span></header>
<div class="chat" id="chat"><article class="msg"><div class="role">WoHo AI</div><div class="text">Hello! I’m WoHo AI. The Windows desktop foundation is ready. @woho/agents integration is the next layer.</div></article></div>
<form class="compose" id="form"><input id="input" placeholder="Ask WoHo AI..." aria-label="Ask WoHo AI"><button>Send</button></form>
</section></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v)return;chat.insertAdjacentHTML('beforeend', '<article class="msg user"><div class="role">You</div><div class="text"></div></article>');chat.lastElementChild.querySelector('.text').textContent=v;input.value='';chat.insertAdjacentHTML('beforeend','<article class="msg"><div class="role">WoHo AI</div><div class="text">Message received. The agent execution bridge will be connected in Step 2.</div></article>');chat.scrollTop=chat.scrollHeight});
document.getElementById('new').addEventListener('click',()=>{chat.innerHTML='<article class="msg"><div class="role">WoHo AI</div><div class="text">New chat ready.</div></article>';input.value='';});
</script>
</body></html>
