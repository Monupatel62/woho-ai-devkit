name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish all public @woho packages to npm"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:check
      - run: pnpm pack:check
      - run: pnpm consumer:check

      - name: Verify release tag matches workspace version
        if: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag $actual does not match workspace version $expected"
            exit 1
          fi
          if [ "${{ github.event.release.tag_name }}" != "$actual" ]; then
            echo "Published release tag does not match checked-out ref"
            exit 1
          fi

      - name: Verify package metadata
        run: |
          node -e "for (const p of ['core','provider-openai','agents','tools','memory','mcp']) { const x=require('./packages/'+p+'/package.json'); if (!x.publishConfig || x.publishConfig.access !== 'public') throw new Error(p+' missing public publishConfig'); if (x.private) throw new Error(p+' must not be private'); if (!Array.isArray(x.files) || !x.files.includes('dist')) throw new Error(p+' missing dist in files'); }"

  publish:
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:check
      - run: pnpm pack:check

      - name: Validate npm publish manifests
        run: |
          set -euo pipefail
          pnpm -r --filter './packages/*' publish --dry-run --access public --provenance --no-git-checks

      - name: Check publish status
        run: |
          set -euo pipefail
          for p in core provider-openai agents tools memory mcp; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already exists on npm; aborting to avoid accidental republish."
              exit 1
            fi
            echo "Ready: $name@$version"
          done

      - name: Publish packages
        run: pnpm -r --filter './packages/*' publish --access public --provenance --no-git-checks
